version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend-deps: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-deps: { patterns: ["*"] }
    ignore:
      # majors the ecosystem can't take yet: typescript-eslint rejects
      # TS 7 at load (peer "<6.1.0" as of 2026-10-21). Drop each entry
      # once the blocker upstream ships; board card "Held majors" tracks
      # the quarterly re-check.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
