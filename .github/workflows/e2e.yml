name: E2E

on:
  push: { branches: [main] }
  pull_request:

jobs:
  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for stack
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1 \
               && curl -fsS -o /dev/null http://localhost:3000 2>/dev/null; then
              echo "stack is up"
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy in time"
          docker compose ps
          docker compose logs
          exit 1
      - name: Run smoke test
        run: bash scripts/e2e_smoke.sh http://localhost:3000
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

  browser:
    name: playwright golden paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Wait for stack
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1 \
               && curl -fsS -o /dev/null http://localhost:3000 2>/dev/null; then
              echo "stack is up"
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy in time"
          docker compose ps
          docker compose logs
          exit 1
      - run: pnpm e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs
