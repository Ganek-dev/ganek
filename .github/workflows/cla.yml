name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Ganek-dev/ganek/blob/main/CLA.md
          branch: cla-signatures
          allowlist: grumpy-miner,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request! Before we can merge, we need you to
            sign the [Contributor License Agreement](https://github.com/Ganek-dev/ganek/blob/main/CLA.md)
            — you keep your copyright, details in the document. Sign by
            replying with the comment below.
