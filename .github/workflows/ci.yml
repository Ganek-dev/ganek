name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  questions:
    name: Validate question bank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - run: python questions/validate.py

  backend:
    name: Backend lint + typecheck + test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
        env:
          # testcontainers needs docker; provided by ubuntu-latest
          TESTCONTAINERS_RYUK_DISABLED: "true"

  frontend:
    name: Frontend lint + typecheck + test
    runs-on: ubuntu-latest
    # Remove this once frontend/ is scaffolded (M0)
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
