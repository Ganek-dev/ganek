name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  questions:
    name: Validate question bank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - run: python questions/validate.py

  backend:
    name: Backend lint + typecheck + test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # 3.12 = contributor floor, 3.14 = runtime
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vetd
          POSTGRES_PASSWORD: vetd
          POSTGRES_DB: vetd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vetd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
    env:
      VETD_DATABASE_URL: postgresql+asyncpg://vetd:vetd@localhost:5432/vetd_test
      VETD_S3_ENDPOINT_URL: http://localhost:9000
      VETD_S3_BUCKET: vetd-cvs-test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    name: Frontend lint + typecheck + test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
