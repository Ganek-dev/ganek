name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  questions:
    name: Validate question bank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - run: python questions/validate.py

  backend:
    name: Backend lint + typecheck + test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
        env:
          # testcontainers needs docker; provided by ubuntu-latest
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # frontend job will be added when frontend/ is scaffolded (M0) —
  # job-level `if: hashFiles(...)` is not supported by Actions and broke the workflow.
