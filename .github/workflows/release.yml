name: Release images

# Build, boot-smoke, scan, and (on version tags) publish the GHCR images
# for the compose quickstart. The frontend image bakes its CSP upload
# origin and backend URL at build time - published defaults match the
# bundled compose topology; custom upload domains still rebuild locally
# (documented in .env.example). workflow_dispatch runs everything except
# the push as a dry run, so the workflow itself is testable before the
# first tag exists.
#
# Images are published for linux/amd64 and linux/arm64 (Apple Silicon and
# most new self-host boxes). buildx cannot `load` a multi-arch manifest
# into the runner's docker, so the job builds twice: an amd64-only build
# that is loaded and boot-smoked, then a multi-arch build that reuses the
# amd64 layers from the GHA cache and adds the arm64 leg under QEMU. Only
# the second build pushes, and only on tags.
#
# The boot-smoke exists because of PR #147: next's standalone tracer once
# shipped an image that built green everywhere and crashed only at
# container boot (MODULE_NOT_FOUND). Never publish an image that hasn't
# actually booted.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dry-run" >> "$GITHUB_OUTPUT"
          fi
      - name: Backend image (amd64, loaded for the boot smoke)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ghcr.io/ganek-dev/ganek-backend:${{ steps.meta.outputs.version }}
            ghcr.io/ganek-dev/ganek-backend:latest
      - name: Frontend image (amd64, compose-default build args)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            BACKEND_URL=http://backend:8000
            GANEK_S3_PUBLIC_ENDPOINT_URL=http://localhost:9000
          tags: |
            ghcr.io/ganek-dev/ganek-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/ganek-dev/ganek-frontend:latest
      - name: Boot the built images
        run: |
          cp .env.example .env
          # migrate gets NO ./questions mount here: the smoke proves the image
          # seeds the bank on its own (image-only deployments have no checkout)
          cat > compose.release-smoke.yml <<EOF
          services:
            backend:  { image: "ghcr.io/ganek-dev/ganek-backend:${{ steps.meta.outputs.version }}" }
            worker:   { image: "ghcr.io/ganek-dev/ganek-backend:${{ steps.meta.outputs.version }}" }
            migrate:
              image: "ghcr.io/ganek-dev/ganek-backend:${{ steps.meta.outputs.version }}"
              volumes: !override []
            frontend: { image: "ghcr.io/ganek-dev/ganek-frontend:${{ steps.meta.outputs.version }}" }
          EOF
          # images exist locally, so compose uses them as-is (no --build)
          docker compose -f docker-compose.yml -f compose.release-smoke.yml up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1 \
               && curl -fsS -o /dev/null http://localhost:3000 2>/dev/null; then
              echo "stack is up"
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy in time"
          docker compose -f docker-compose.yml -f compose.release-smoke.yml ps
          docker compose -f docker-compose.yml -f compose.release-smoke.yml logs
          exit 1
      - name: Question bank seeded from the image (no checkout mount)
        run: |
          docker compose -f docker-compose.yml -f compose.release-smoke.yml logs migrate > migrate.log
          grep -E "question bank seeded from /srv/questions: [0-9]+ created" migrate.log || {
            echo "migrate did not seed from the image"; cat migrate.log; exit 1; }
          created=$(grep -oE "seeded from /srv/questions: [0-9]+ created" migrate.log | grep -oE "[0-9]+")
          echo "questions created: $created"
          [ "$created" -ge 225 ] || { echo "expected at least 225 questions"; exit 1; }
      - name: Smoke test against the built images
        run: bash scripts/e2e_smoke.sh http://localhost:3000
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f compose.release-smoke.yml ps
          docker compose -f docker-compose.yml -f compose.release-smoke.yml logs
      - name: Trivy scan backend image (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/ganek-dev/ganek-backend:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Trivy scan frontend image (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/ganek-dev/ganek-frontend:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Multi-arch manifests. The amd64 leg is a cache hit from the builds
      # above (same context and args); only the arm64 leg is new work. On
      # workflow_dispatch this still builds both legs (push: false) so an
      # arm64 regression shows up before the next tag.
      - name: Backend image (amd64 + arm64, pushed on tags)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          provenance: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ghcr.io/ganek-dev/ganek-backend:${{ steps.meta.outputs.version }}
            ghcr.io/ganek-dev/ganek-backend:latest
      - name: Frontend image (amd64 + arm64, pushed on tags)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          provenance: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            BACKEND_URL=http://backend:8000
            GANEK_S3_PUBLIC_ENDPOINT_URL=http://localhost:9000
          tags: |
            ghcr.io/ganek-dev/ganek-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/ganek-dev/ganek-frontend:latest
