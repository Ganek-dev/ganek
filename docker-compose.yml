# Vetd self-host stack. Copy .env.example to .env first.
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      VETD_DATABASE_URL: postgresql+asyncpg://vetd:${POSTGRES_PASSWORD:-vetd}@postgres:5432/vetd
      VETD_REDIS_URL: redis://redis:6379/0
      VETD_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]

  migrate:
    build: ./backend
    env_file: .env
    environment:
      VETD_DATABASE_URL: postgresql+asyncpg://vetd:${POSTGRES_PASSWORD:-vetd}@postgres:5432/vetd
    command: sh -c "uv run alembic upgrade head && uv run python -m app.services.seed"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vetd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetd}
      POSTGRES_DB: vetd
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetd"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes: [miniodata:/data]
    ports: ["9001:9001"]

volumes:
  pgdata:
  miniodata:
