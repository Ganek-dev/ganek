# Ganek self-host stack. Copy .env.example to .env first.
name: vetd

# Bounded log retention (GDPR G4): access logs hold client IPs — without
# rotation, Docker's json-file driver keeps them forever.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  backend:
    build: ./backend
    logging: *default-logging
    env_file: .env
    environment:
      VETD_DATABASE_URL: postgresql+asyncpg://vetd:${POSTGRES_PASSWORD:-vetd}@postgres:5432/vetd
      VETD_REDIS_URL: redis://redis:6379/0
      VETD_S3_ENDPOINT_URL: http://minio:9000
      # Presigned upload URLs must be reachable from candidates' browsers
      VETD_S3_PUBLIC_ENDPOINT_URL: ${VETD_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    # loopback-only by default: a host-published backend + XFF trust would let
    # remote clients spoof their IP past the rate limits (SECURITY_REVIEW #1)
    ports: ["127.0.0.1:8000:8000"]

  worker:
    logging: *default-logging
    build: ./backend
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      VETD_DATABASE_URL: postgresql+asyncpg://vetd:${POSTGRES_PASSWORD:-vetd}@postgres:5432/vetd
      VETD_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        # Baked into the CSP (connect-src) — must match what the backend
        # signs upload URLs against, or browsers block the CV upload.
        VETD_S3_PUBLIC_ENDPOINT_URL: ${VETD_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    environment:
      BACKEND_URL: http://backend:8000
      # absolute URLs in sitemap.xml / robots.txt / OG metadata
      VETD_PUBLIC_BASE_URL: ${VETD_PUBLIC_BASE_URL:-http://localhost:3000}
    depends_on: [backend]
    ports: ["3000:3000"]

  migrate:
    logging: *default-logging
    build: ./backend
    env_file: .env
    environment:
      VETD_DATABASE_URL: postgresql+asyncpg://vetd:${POSTGRES_PASSWORD:-vetd}@postgres:5432/vetd
    volumes:
      - ./questions:/srv/questions:ro
    command: sh -c "uv run alembic upgrade head && uv run python -m app.services.seed"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vetd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetd}
      POSTGRES_DB: vetd
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetd"]
      interval: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7-alpine

  minio:
    logging: *default-logging
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes: [miniodata:/data]
    # loopback-only: candidates only ever need the presigned-upload host you
    # configured — never the MinIO API/console themselves (.env.example §prod)
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

volumes:
  pgdata:
    # Explicit global names: Docker matches volumes by name only, so a
    # generic name like vetd_pgdata can silently collide with (and reuse
    # the data of) another project's volume.
    name: vetd-postgres-data
  miniodata:
    name: vetd-minio-data
