# Ganek self-host stack. Copy .env.example to .env first.
name: ganek

# Bounded log retention (GDPR G4): access logs hold client IPs - without
# rotation, Docker's json-file driver keeps them forever.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    logging: *default-logging
    env_file: .env
    environment:
      GANEK_DATABASE_URL: postgresql+asyncpg://ganek:${POSTGRES_PASSWORD:-ganek}@postgres:5432/ganek
      GANEK_REDIS_URL: redis://redis:6379/0
      GANEK_S3_ENDPOINT_URL: http://minio:9000
      # Presigned upload URLs must be reachable from candidates' browsers
      GANEK_S3_PUBLIC_ENDPOINT_URL: ${GANEK_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    # the image has no curl; the venv's python is always there
    healthcheck:
      test:
        - CMD
        - /srv/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # loopback-only by default: a host-published backend + XFF trust would let
    # remote clients spoof their IP past the rate limits (SECURITY_REVIEW #1)
    ports: ["127.0.0.1:8000:8000"]

  worker:
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    # arq exits (code 1) when redis goes away; without this a redis blip
    # silently ends nightly purges and queued email until someone notices
    restart: unless-stopped
    env_file: .env
    environment:
      GANEK_DATABASE_URL: postgresql+asyncpg://ganek:${POSTGRES_PASSWORD:-ganek}@postgres:5432/ganek
      GANEK_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # arq writes a health key to redis every 60s; --check reads it back
    healthcheck:
      test: ["CMD", "/srv/.venv/bin/arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        # Baked into the CSP (connect-src) - must match what the backend
        # signs upload URLs against, or browsers block the CV upload.
        GANEK_S3_PUBLIC_ENDPOINT_URL: ${GANEK_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    environment:
      BACKEND_URL: http://backend:8000
      # absolute URLs in sitemap.xml / robots.txt / OG metadata
      GANEK_PUBLIC_BASE_URL: ${GANEK_PUBLIC_BASE_URL:-http://localhost:3000}
      # Next's standalone server binds to $HOSTNAME, which Docker sets to the
      # container id, so nothing listens on 127.0.0.1 unless we say so
      HOSTNAME: 0.0.0.0
    depends_on:
      backend: { condition: service_healthy }
    # alpine's busybox wget; /api/health goes through the proxy rewrite, so a
    # green frontend also proves the frontend -> backend path
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports: ["3000:3000"]

  migrate:
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      GANEK_DATABASE_URL: postgresql+asyncpg://ganek:${POSTGRES_PASSWORD:-ganek}@postgres:5432/ganek
    # The image already carries questions/; this mount only lets a checkout
    # seed locally edited YAML. Image-only deployments drop it.
    volumes:
      - ./questions:/srv/questions:ro
    command: sh -c "uv run alembic upgrade head && uv run python -m app.services.seed"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ganek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ganek}
      POSTGRES_DB: ganek
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganek"]
      interval: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    logging: *default-logging
    # MinIO pulled its free images from Docker Hub (2026-09-11) and gated
    # quay.io (2026-09-24); pgsty/minio is Pigsty's maintained community fork
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    # loopback-only: candidates only ever need the presigned-upload host you
    # configured - never the MinIO API/console themselves (.env.example §prod)
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

volumes:
  pgdata:
    # Explicit global names: Docker matches volumes by name only, so a
    # generic name like ganek_pgdata can silently collide with (and reuse
    # the data of) another project's volume.
    name: ganek-postgres-data
  miniodata:
    name: ganek-minio-data
