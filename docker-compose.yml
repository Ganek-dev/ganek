# Vetd self-host stack. Copy .env.example to .env first.
name: vetd
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      VETD_DATABASE_URL: postgresql+asyncpg://vetd:${POSTGRES_PASSWORD:-vetd}@postgres:5432/vetd
      VETD_REDIS_URL: redis://redis:6379/0
      VETD_S3_ENDPOINT_URL: http://minio:9000
      # Presigned upload URLs must be reachable from candidates' browsers
      VETD_S3_PUBLIC_ENDPOINT_URL: ${VETD_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]

  migrate:
    build: ./backend
    env_file: .env
    environment:
      VETD_DATABASE_URL: postgresql+asyncpg://vetd:${POSTGRES_PASSWORD:-vetd}@postgres:5432/vetd
    volumes:
      - ./questions:/srv/questions:ro
    command: sh -c "uv run alembic upgrade head && uv run python -m app.services.seed"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vetd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetd}
      POSTGRES_DB: vetd
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetd"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
    # Explicit global names: Docker matches volumes by name only, so a
    # generic name like vetd_pgdata can silently collide with (and reuse
    # the data of) another project's volume.
    name: vetd-postgres-data
  miniodata:
    name: vetd-minio-data
