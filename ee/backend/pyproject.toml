# Commercial plane (ee/LICENSE, not AGPL). Installed only into the hosted
# image target (backend/Dockerfile) and the `ee` CI job; the public images
# never contain it. It imports the core's `app` package from the backend
# working directory, so it is not usable on its own.
[project]
name = "ganek-ee"
version = "0.6.0"
description = "Ganek hosted-plane extensions (plan policy, billing, SAML)"
requires-python = ">=3.12"
license = { text = "Ganek Commercial License (ee/LICENSE)" }
# SAML 2.0 (card "SAML 2.0 sign-in (ee/)"). xmlsec and lxml ship manylinux
# wheels that bundle libxml2; both must load the SAME libxml2 or signature
# checks crash, which ganek_ee.saml.check_native_bindings guards. The floors
# are the first releases with matching cp314 wheels.
dependencies = [
    "stripe>=16,<17",
    "python3-saml>=1.16,<2",
    "xmlsec>=1.3.18,<2",
    "lxml>=6.1,<7",
]

[project.entry-points."ganek.plan_policy"]
hosted = "ganek_ee.plans:HostedPolicy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ganek_ee"]

[tool.ruff]
extend = "../../backend/pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["app", "ganek_ee"]
